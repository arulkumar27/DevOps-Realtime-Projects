# Security policy applied only to the temporary development environment.

framework:
  - terraform

# Any finding not explicitly approved below must fail the scan.
soft-fail: false
compact: true

# Production-only controls intentionally deferred in development.
skip-check:
  - CKV_AWS_91
  - CKV_AWS_150
  - CKV_AWS_2
  - CKV2_AWS_20
  - CKV2_AWS_28
  - CKV_AWS_103
  - CKV_AWS_378
  - CKV2_AWS_11

# Checkov cannot trace these security-group attachments across module boundaries.
  - CKV2_AWS_5