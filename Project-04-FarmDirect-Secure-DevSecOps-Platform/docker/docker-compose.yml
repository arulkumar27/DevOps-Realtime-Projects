services:
  database:
    platform: linux/amd64
    image: postgres:16-bookworm
    container_name: farmdirect-database
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../app/database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    networks:
      - farmdirect-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../app/backend
    container_name: farmdirect-backend
    restart: unless-stopped
    env_file:
      - ../app/backend/.env
    environment:
      DB_HOST: database
      DB_PORT: 5432
    ports:
      - "${BACKEND_PORT}:5000"
    depends_on:
      database:
        condition: service_healthy
    networks:
      - farmdirect-network

  frontend:
    build:
      context: ../app/frontend
    container_name: farmdirect-frontend
    restart: unless-stopped
    ports:
      - "8081:80"
    depends_on:
      - backend
    networks:
      - farmdirect-network

networks:
  farmdirect-network:
    name: farmdirect-network

volumes:
  postgres_data:
    name: farmdirect-postgres-data